name: Bug report
description: Something that crashes, hangs, draws or sounds wrong, or a build step that fails
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are what a problem is traced with; without them the first reply is a request for them.
        Never attach disc images, BIOS dumps, memory cards, save states, game apps, generated code or anything extracted from a game. Review logs before sharing them.
        For a security vulnerability, follow SECURITY.md's private reporting instructions instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. The last log lines, a `[RED]` line or a screenshot help. Say whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "From About muyiunative or the first log line, including the build number. Report a Problem fills this in."
      placeholder: 0.7.0 (build 123)
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: muyiunative commit
      description: "From About muyiunative, the first log line, or `git rev-parse --short HEAD` in the checkout."
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and serial
      description: The game's name and its serial (on the disc's label, or in SYSTEM.CNF), if a game was involved.
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Mac and macOS version
      description: The Mac with its chip, and the macOS version (Apple menu > About This Mac).
      placeholder: MacBook Pro M2 Max, macOS 26.1
    validations:
      required: true
  - type: input
    id: renderer
    attributes:
      label: Renderer
      description: Software or Metal and its scale, as shown in the Graphics menu. Report a Problem fills this in.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it was built and run
      description: Whether you used Build Game App in the launcher or a terminal command, the steps taken, and how the app was started.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Report a Problem reveals the current run's log in Finder; review it for personal information and game data before attaching. Logs from Finder launches are in
        ~/Library/Logs/muyiunative/<bundle id>/ (last five runs; home paths are replaced with ~). From a terminal,
        `shell/mac/build/muyiunative.app/Contents/MacOS/muyiunative 2>&1 | tee run.log` keeps it in run.log. For a build failure, the build's full output.
    validations:
      required: true
  - type: checkboxes
    id: no-game-data
    attributes:
      label: No game data
      options:
        - label: Nothing attached contains disc images, BIOS dumps, memory cards, save states, game apps, generated code or data extracted from a game.
          required: true
