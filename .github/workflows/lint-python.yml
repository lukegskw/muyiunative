# Python lint and types over the tools: ruff (lint rules for bugs, never formatting) and pyright in basic mode, configured in pyproject.toml. Every finding fails the job: fix it,
# or silence it on its line (`# noqa: <rule>`, `# pyright: ignore[<rule>]`) with a reason. The tool versions are pinned in .github/requirements/lint.txt; docs/development.md
# has the commands to run them locally.
name: lint-python

on:
  pull_request:
    paths:
      [
        "**.py",
        pyproject.toml,
        .github/requirements/lint.txt,
        .github/workflows/lint-python.yml,
      ]
  push:
    branches: [main]
    paths:
      [
        "**.py",
        pyproject.toml,
        .github/requirements/lint.txt,
        .github/workflows/lint-python.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), as in tests.yml
jobs:
  lint:
    name: ruff and pyright
    runs-on: ubuntu-24.04 # pyproject.toml fixes the platform pyright assumes (Darwin), so the findings match a Mac's
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements/lint.txt
      - name: Install the pinned tools
        run: python -m pip install -r .github/requirements/lint.txt
      - name: ruff
        run: python -m ruff check --output-format github .
      - name: pyright
        run: python -m pyright
